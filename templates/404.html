{% extends "base.html" %}

{% block title %}Page Not Found - EduPortal{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="py-5">
                <div class="mb-4">
                    <svg width="200" height="200" viewBox="0 0 200 200" class="text-primary">
                        <circle cx="100" cy="100" r="80" stroke="currentColor" stroke-width="4" fill="none"/>
                        <text x="100" y="120" text-anchor="middle" font-size="48" font-weight="bold" fill="currentColor">404</text>
                    </svg>
                </div>
                <h1 class="display-4 text-primary mb-3">Page Not Found</h1>
                <h3 class="mb-3">Oops! This page doesn't exist</h3>
                <p class="text-muted mb-4">
                    The page you're looking for might have been moved, deleted, or you entered the wrong URL.
                </p>
                <div class="d-grid gap-2 d-md-block">
                    <a href="{{ url_for('index') }}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i>Go Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
